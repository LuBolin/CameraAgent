<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Helper device target</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #fff; background: #000; font: 16px system-ui, sans-serif; overflow: hidden; }
    main { width: 100vw; height: 100vh; }
    nav { position: fixed; z-index: 1; display: flex; gap: .5rem; width: 100%; padding: .6rem; background: #111d; opacity: 0; overflow-x: auto; }
    nav:hover, nav:focus-within { opacity: 1; }
    button { padding: .55rem .75rem; color: #fff; background: #292929; border: 1px solid #777; border-radius: .4rem; white-space: nowrap; }
    button[aria-pressed="true"] { color: #06121f; background: #8bc7ff; border-color: #8bc7ff; }
    img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Camera targets"></nav>
    <img alt="Neutral portrait camera target" src="neutral-portrait.png">
  </main>
  <script>
    // The acceptance runner is the only authority allowed to start playback.
    // Cancel anything left queued by an older fixture tab before arming this page.
    speechSynthesis.cancel();
    const params = new URLSearchParams(location.search);
    const customImage = params.get("image");
    const targets = [
      ["Neutral portrait", "neutral-portrait.png"],
      ["Cold scene", "cold-blue-scene.png"],
      ["Warm scene", "warm-yellow-scene.png"],
      ["Natural large face", "large-face-natural-perspective.png"],
      ["Wide close face", "wide-angle-distorted-face.png"],
      ["Extreme close face", "close-face.png"]
    ];
    const nav = document.querySelector("nav");
    const image = document.querySelector("img");
    if (customImage) {
      image.src = customImage;
      image.alt = "Custom camera target";
      image.style.objectFit = "contain";
    }
    targets.forEach(([label, source], index) => {
      const button = document.createElement("button");
      button.textContent = `${index + 1} · ${label}`;
      button.setAttribute("aria-pressed", index === 0);
      button.onclick = () => {
        image.src = source;
        image.alt = `${label} camera target`;
        document.querySelectorAll("button").forEach((item) => item.setAttribute("aria-pressed", item === button));
      };
      nav.append(button);
    });
    const speechText = params.get("speech") || "Make the picture brighter and zoom in.";
    const voiceButton = document.createElement("button");
    voiceButton.textContent = "V · Speak compound";
    voiceButton.title = `Say: ${speechText}`;
    voiceButton.onclick = () => {
      speechSynthesis.cancel();
      document.title = "Photo Helper device target · queued";
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = "en-US";
      utterance.rate = 0.85;
      utterance.volume = 1;
      const englishVoices = speechSynthesis.getVoices().filter(
        (voice) => voice.lang.toLowerCase().startsWith("en"),
      );
      utterance.voice = englishVoices.find(
        (voice) => !voice.localService && voice.name.toLowerCase().includes("natural"),
      ) || englishVoices.find((voice) => !voice.localService) ||
        englishVoices.find((voice) => voice.localService) || null;
      utterance.onstart = () => { document.title = "Photo Helper device target · speaking"; };
      utterance.onend = () => { document.title = "Photo Helper device target · spoken"; };
      utterance.onerror = () => { document.title = "Photo Helper device target · speech error"; };
      speechSynthesis.speak(utterance);
    };
    nav.append(voiceButton);
    addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "v") {
        voiceButton.click();
        return;
      }
      const index = Number(event.key) - 1;
      if (targets[index]) nav.children[index].click();
    });
  </script>
</body>
</html>
