<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a333a"/>
      <stop offset="1" stop-color="#1a2024"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="100" y="40" width="420" height="820" rx="42" fill="#0d0f11" stroke="#4a5b66" stroke-width="4"/>
  <rect x="118" y="58" width="384" height="784" rx="28" fill="url(#bgGrad)"/>

  <!-- Status bar -->
  <text x="150" y="95" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">02:15</text>
  <text x="430" y="95" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">100%</text>

  <!-- Top chrome -->
  <g transform="translate(138, 130)">
    <circle cx="18" cy="18" r="5" fill="#ef4444"/>
    <text x="34" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">LIVE</text>
  </g>

  <g transform="translate(250, 132)">
    <path d="M8 4 L12 0 L16 4 M12 0 L12 10" stroke="#ffb347" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="22" y="13" fill="#fff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">×</text>
  </g>

  <g transform="translate(330, 132)">
    <path d="M12 3 A9 9 0 1 0 12 21 A9 9 0 1 0 12 3 M12 8 L12 12 L15 15" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(400, 132)">
    <text x="0" y="15" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">?</text>
  </g>

  <g transform="translate(440, 132)">
    <text x="0" y="15" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Settings</text>
  </g>

  <!-- Bottom controls -->
  <g transform="translate(190, 680)">
    <circle cx="40" cy="40" r="34" fill="none" stroke="#fff8" stroke-width="1.5"/>
    <text x="40" y="48" text-anchor="middle" fill="#ffb347" font-size="22">✦</text>
  </g>

  <g transform="translate(290, 660)">
    <circle cx="60" cy="60" r="56" fill="none" stroke="#fff" stroke-width="6"/>
    <circle cx="60" cy="60" r="42" fill="#fff"/>
  </g>

  <g transform="translate(420, 680)">
    <circle cx="40" cy="40" r="34" fill="none" stroke="#fff8" stroke-width="1.5"/>
    <text x="40" y="48" text-anchor="middle" fill="#8ecae6" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Mic</text>
  </g>

  <!-- Callout lines and labels -->
  <line x1="570" y1="150" x2="530" y2="150" stroke="#ffb347" stroke-width="2"/>
  <circle cx="570" cy="150" r="5" fill="#ffb347"/>
  <text x="590" y="140" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">1. Mixed iconography + text</text>
  <text x="590" y="162" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="14">Settings uses text while others use icons. Pick one pattern.</text>

  <line x1="570" y1="230" x2="280" y2="150" stroke="#ffb347" stroke-width="2"/>
  <circle cx="570" cy="230" r="5" fill="#ffb347"/>
  <text x="590" y="220" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">2. Flash glyph is ambiguous</text>
  <text x="590" y="242" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="14">"×" can mean off, unavailable, or error. Use a struck-out bolt or label.</text>

  <line x1="570" y1="310" x2="350" y2="740" stroke="#ffb347" stroke-width="2"/>
  <circle cx="570" cy="310" r="5" fill="#ffb347"/>
  <text x="590" y="300" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">3. Orb overload</text>
  <text x="590" y="322" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="14">One control = shutter, voice-finish, decision-confirm, error-dismiss, long-press enhance.</text>
  <text x="590" y="342" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="14">Add a subtle label or coach mark on first use.</text>

  <line x1="570" y1="410" x2="450" y2="740" stroke="#ffb347" stroke-width="2"/>
  <circle cx="570" cy="410" r="5" fill="#ffb347"/>
  <text x="590" y="400" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">4. Mic target is 44 dp</text>
  <text x="590" y="422" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="14">Below Material's 48 dp accessibility minimum. Increase to 48–56 dp.</text>

  <line x1="570" y1="490" x2="230" y2="740" stroke="#ffb347" stroke-width="2"/>
  <circle cx="570" cy="490" r="5" fill="#ffb347"/>
  <text x="590" y="480" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">5. Sparkle icon lacks context</text>
  <text x="590" y="502" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="14">"Auto-enhance" is hidden behind an abstract star. Consider a text label or tooltip.</text>

  <line x1="570" y1="570" x2="310" y2="110" stroke="#ffb347" stroke-width="2"/>
  <circle cx="570" cy="570" r="5" fill="#ffb347"/>
  <text x="590" y="560" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">6. Reset icon with no label</text>
  <text x="590" y="582" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="14">The curved arrow reads as "undo/rotate". Pair with a text label or use "Reset".</text>
</svg>