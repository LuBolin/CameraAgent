<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="lightBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5eb"/>
      <stop offset="1" stop-color="#f5e8d8"/>
    </linearGradient>
  </defs>

  <text x="600" y="36" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Gallery &amp; share: hierarchy and language</text>

  <!-- Share screen mockup -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="320" height="540" rx="24" fill="url(#lightBg)" stroke="#d4c4b0" stroke-width="2"/>

    <!-- Header -->
    <text x="24" y="48" fill="#36454f" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Share 4 photos</text>
    <text x="24" y="48" fill="#36454f" font-family="system-ui, sans-serif" font-size="20">←</text>

    <!-- Photo strip -->
    <rect x="24" y="70" width="70" height="70" rx="8" fill="#6b5a50"/>
    <circle cx="36" cy="82" r="12" fill="#8a5200"/>
    <text x="36" y="87" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1</text>
    <text x="90" y="100" fill="#36454f" font-family="system-ui, sans-serif" font-size="18">← → ✕</text>

    <!-- Caption chips -->
    <rect x="24" y="160" width="90" height="32" rx="16" fill="#8a5200" opacity="0.2"/>
    <text x="69" y="181" text-anchor="middle" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Short caption</text>
    <rect x="124" y="160" width="90" height="32" rx="16" fill="#fff" stroke="#d4c4b0"/>
    <text x="169" y="181" text-anchor="middle" fill="#36454f" font-family="system-ui, sans-serif" font-size="14">Long caption</text>

    <!-- Caption input -->
    <rect x="24" y="210" width="272" height="70" rx="8" fill="#fff" stroke="#d4c4b0"/>
    <text x="40" y="240" fill="#8a9aa3" font-family="system-ui, sans-serif" font-size="15">Caption</text>
    <text x="270" y="240" fill="#8a9aa3" font-family="system-ui, sans-serif" font-size="18">🎤</text>

    <!-- Buttons -->
    <rect x="24" y="310" width="272" height="44" rx="12" fill="#8a5200"/>
    <text x="160" y="338" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Share…</text>

    <rect x="24" y="364" width="272" height="44" rx="12" fill="none" stroke="#8a5200" stroke-width="2"/>
    <text x="160" y="392" text-anchor="middle" fill="#8a5200" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Telegram</text>

    <text x="24" y="430" fill="#6b5a50" font-family="system-ui, sans-serif" font-size="13">Use Share… for WeChat and other installed apps.</text>

    <!-- Issues -->
    <line x1="340" y1="386" x2="310" y2="386" stroke="#ef4444" stroke-width="2"/>
    <circle cx="340" cy="386" r="5" fill="#ef4444"/>
    <text x="360" y="382" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Telegram is oddly specific</text>
    <text x="360" y="402" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="13">Promotes one app; remove or allow customization.</text>

    <line x1="340" y1="245" x2="306" y2="245" stroke="#ef4444" stroke-width="2"/>
    <circle cx="340" cy="245" r="5" fill="#ef4444"/>
    <text x="360" y="241" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Caption input appears before generation</text>
    <text x="360" y="261" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="13">Show a "Generate caption" CTA first, then the editable result.</text>
  </g>

  <!-- Gallery screen mockup -->
  <g transform="translate(560, 70)">
    <rect x="0" y="0" width="320" height="540" rx="24" fill="url(#lightBg)" stroke="#d4c4b0" stroke-width="2"/>

    <text x="24" y="48" fill="#36454f" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Gallery</text>
    <text x="24" y="48" fill="#36454f" font-family="system-ui, sans-serif" font-size="20">←</text>
    <text x="160" y="48" fill="#8a5200" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Select</text>
    <text x="228" y="48" fill="#8a5200" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Choose photos</text>

    <!-- Grid -->
    <rect x="24" y="70" width="80" height="80" rx="4" fill="#6b5a50"/>
    <rect x="120" y="70" width="80" height="80" rx="4" fill="#6b5a50"/>
    <rect x="216" y="70" width="80" height="80" rx="4" fill="#6b5a50"/>
    <rect x="24" y="166" width="80" height="80" rx="4" fill="#6b5a50"/>
    <rect x="120" y="166" width="80" height="80" rx="4" fill="#6b5a50"/>
    <rect x="216" y="166" width="80" height="80" rx="4" fill="#6b5a50"/>

    <!-- Banner -->
    <rect x="24" y="270" width="272" height="90" rx="12" fill="#8a5200" opacity="0.15"/>
    <text x="40" y="300" fill="#36454f" font-family="system-ui, sans-serif" font-size="13">Allow gallery access to browse photos</text>
    <rect x="40" y="318" width="100" height="32" rx="8" fill="#8a5200"/>
    <text x="90" y="339" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Allow access</text>
    <rect x="152" y="318" width="100" height="32" rx="8" fill="none" stroke="#8a5200"/>
    <text x="202" y="339" text-anchor="middle" fill="#8a5200" font-family="system-ui, sans-serif" font-size="13">Use picker</text>

    <!-- Issues -->
    <line x1="340" y1="300" x2="306" y2="300" stroke="#ef4444" stroke-width="2"/>
    <circle cx="340" cy="300" r="5" fill="#ef4444"/>
    <text x="360" y="296" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Two entry points, similar labels</text>
    <text x="360" y="316" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="13">"Choose photos" and "Use photo picker" do the same thing. Consolidate.</text>

    <line x1="340" y1="110" x2="306" y2="110" stroke="#ef4444" stroke-width="2"/>
    <circle cx="340" cy="110" r="5" fill="#ef4444"/>
    <text x="360" y="106" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Header action overload</text>
    <text x="360" y="126" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="13">Consider a floating action button for adding photos.</text>
  </g>

  <!-- Recommendations box -->
  <g transform="translate(920, 120)">
    <text x="0" y="0" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Recommendations</text>

    <g transform="translate(0, 40)">
      <circle cx="8" cy="8" r="8" fill="#8fbf9c"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Remove Telegram-only button</text>
    </g>

    <g transform="translate(0, 80)">
      <circle cx="8" cy="8" r="8" fill="#8fbf9c"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Generate caption → edit, not edit first</text>
    </g>

    <g transform="translate(0, 120)">
      <circle cx="8" cy="8" r="8" fill="#8fbf9c"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Consolidate "Choose photos" / picker</text>
    </g>

    <g transform="translate(0, 160)">
      <circle cx="8" cy="8" r="8" fill="#8fbf9c"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">4</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Add selected-photo count in selection bar</text>
    </g>
  </g>
</svg>