<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <linearGradient id="sheetBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5eb"/>
      <stop offset="1" stop-color="#f5e8d8"/>
    </linearGradient>
  </defs>

  <text x="600" y="36" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Settings: the unreachable API-key setup</text>

  <!-- Current sheet -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="360" height="620" rx="24" fill="url(#sheetBg)" stroke="#d4c4b0" stroke-width="2"/>
    <text x="24" y="48" fill="#36454f" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Settings</text>

    <!-- Group 1 -->
    <text x="24" y="90" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Sound &amp; Vibration</text>
    <rect x="16" y="104" width="328" height="86" rx="12" fill="#ffffff60"/>
    <text x="32" y="140" fill="#36454f" font-family="system-ui, sans-serif" font-size="16">Read instructions aloud</text>
    <rect x="300" y="124" width="28" height="16" rx="8" fill="#8a5200"/>
    <text x="32" y="172" fill="#36454f" font-family="system-ui, sans-serif" font-size="16">Vibration feedback</text>
    <rect x="300" y="156" width="28" height="16" rx="8" fill="#8a5200"/>

    <!-- Group 2 -->
    <text x="24" y="230" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Smart Features</text>
    <rect x="16" y="244" width="328" height="86" rx="12" fill="#ffffff60"/>
    <text x="32" y="280" fill="#36454f" font-family="system-ui, sans-serif" font-size="16">Auto-capture when steady</text>
    <rect x="300" y="264" width="28" height="16" rx="8" fill="#8a5200"/>
    <text x="32" y="312" fill="#36454f" font-family="system-ui, sans-serif" font-size="16">Simplified auto mode</text>
    <rect x="300" y="296" width="28" height="16" rx="8" fill="#d4c4b0"/>

    <!-- Group 3 -->
    <text x="24" y="370" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Appearance</text>
    <rect x="16" y="384" width="328" height="120" rx="12" fill="#ffffff60"/>
    <text x="32" y="420" fill="#36454f" font-family="system-ui, sans-serif" font-size="16">Dark mode</text>
    <rect x="300" y="404" width="28" height="16" rx="8" fill="#d4c4b0"/>
    <text x="32" y="452" fill="#36454f" font-family="system-ui, sans-serif" font-size="16">Grid overlay</text>
    <rect x="300" y="436" width="28" height="16" rx="8" fill="#d4c4b0"/>
    <text x="32" y="484" fill="#36454f" font-family="system-ui, sans-serif" font-size="16">Tilt indicator</text>
    <rect x="300" y="468" width="28" height="16" rx="8" fill="#d4c4b0"/>

    <text x="24" y="540" fill="#8a5200" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Advanced options ▼</text>

    <!-- Bug indicator -->
    <circle cx="320" cy="532" r="18" fill="#ef4444"/>
    <text x="320" y="539" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">!</text>
    <line x1="338" y1="532" x2="420" y2="532" stroke="#ef4444" stroke-width="2"/>
    <text x="430" y="528" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">API key UI is defined but never called</text>
    <text x="430" y="548" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="13">QwenKeySetup, VisualProviderChooser, StyleProfileField</text>

    <text x="180" y="660" text-anchor="middle" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="16" font-weight="600">CURRENT</text>
  </g>

  <!-- Proposed sheet -->
  <g transform="translate(620, 70)">
    <rect x="0" y="0" width="360" height="620" rx="24" fill="url(#sheetBg)" stroke="#d4c4b0" stroke-width="2"/>
    <text x="24" y="48" fill="#36454f" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Settings</text>

    <!-- AI Account group moved up -->
    <text x="24" y="90" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AI Account</text>
    <rect x="16" y="104" width="328" height="150" rx="12" fill="#ffffff60"/>
    <text x="32" y="136" fill="#36454f" font-family="system-ui, sans-serif" font-size="16" font-weight="600">AI interpretation</text>
    <rect x="300" y="124" width="28" height="16" rx="8" fill="#d4c4b0"/>
    <text x="32" y="160" fill="#6b5a50" font-family="system-ui, sans-serif" font-size="13">Add your Alibaba Cloud key to enable</text>
    <rect x="24" y="178" width="312" height="38" rx="8" fill="#fff" stroke="#d4c4b0" stroke-width="1"/>
    <text x="36" y="203" fill="#8a9aa3" font-family="system-ui, sans-serif" font-size="14">Paste Bailian API key…</text>
    <rect x="24" y="224" width="312" height="38" rx="8" fill="#8a5200"/>
    <text x="180" y="249" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Test, save &amp; enable</text>

    <!-- Other groups -->
    <text x="24" y="290" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Sound &amp; Vibration</text>
    <rect x="16" y="304" width="328" height="86" rx="12" fill="#ffffff60"/>

    <text x="24" y="420" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Smart Features</text>
    <rect x="16" y="434" width="328" height="86" rx="12" fill="#ffffff60"/>

    <text x="24" y="546" fill="#8a5200" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Appearance</text>
    <rect x="16" y="560" width="328" height="50" rx="12" fill="#ffffff60"/>

    <text x="180" y="660" text-anchor="middle" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="16" font-weight="600">PROPOSED</text>
  </g>

  <!-- Bottom note -->
  <text x="600" y="720" text-anchor="middle" fill="#8a9aa3" font-family="system-ui, sans-serif" font-size="14">Move AI Account above the fold; remove or relabel "Dark mode" since the camera chrome is always dark.</text>
</svg>