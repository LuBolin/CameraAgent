<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a54"/>
      <stop offset="1" stop-color="#253038"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffb347"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Composition guidance overlays</text>

  <!-- BEFORE phone -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="320" height="580" rx="32" fill="#0d0f11" stroke="#4a5b66" stroke-width="3"/>
    <rect x="14" y="14" width="292" height="552" rx="20" fill="url(#phoneBg)"/>

    <!-- Simulated people blobs -->
    <ellipse cx="160" cy="220" rx="50" ry="70" fill="#5a4a42" opacity="0.7"/>
    <ellipse cx="160" cy="180" rx="32" ry="38" fill="#6b5a50" opacity="0.7"/>

    <!-- Current overlay: target rectangle -->
    <rect x="110" y="140" width="100" height="160" fill="none" stroke="#ffb347" stroke-width="3" rx="4"/>

    <!-- Current level line -->
    <line x1="80" y1="290" x2="240" y2="290" stroke="#ffb347" stroke-width="3"/>

    <!-- Mirror bar -->
    <rect x="60" y="440" width="200" height="42" rx="21" fill="#36454f" opacity="0.9" stroke="#ffffff40" stroke-width="1"/>
    <text x="160" y="468" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Aim right</text>

    <!-- Bottom controls -->
    <circle cx="160" cy="530" r="32" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="160" cy="530" r="24" fill="#fff"/>

    <text x="160" y="620" text-anchor="middle" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="16" font-weight="600">BEFORE</text>
    <text x="160" y="642" text-anchor="middle" fill="#8a9aa3" font-family="system-ui, sans-serif" font-size="13">Rectangle only — direction is unclear</text>
  </g>

  <!-- AFTER phone -->
  <g transform="translate(520, 70)">
    <rect x="0" y="0" width="320" height="580" rx="32" fill="#0d0f11" stroke="#4a5b66" stroke-width="3"/>
    <rect x="14" y="14" width="292" height="552" rx="20" fill="url(#phoneBg)"/>

    <!-- People blobs -->
    <ellipse cx="160" cy="220" rx="50" ry="70" fill="#5a4a42" opacity="0.7"/>
    <ellipse cx="160" cy="180" rx="32" ry="38" fill="#6b5a50" opacity="0.7"/>

    <!-- Target zone with glow -->
    <rect x="120" y="150" width="90" height="140" fill="#ffb347" opacity="0.12" rx="8"/>
    <rect x="120" y="150" width="90" height="140" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="6 4" rx="8"/>

    <!-- Direction arrow -->
    <line x1="160" y1="115" x2="190" y2="115" stroke="#ffb347" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="160" y="105" text-anchor="middle" fill="#ffb347" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Move subject this way</text>

    <!-- Progress ring around subject -->
    <path d="M110 140 A70 90 0 0 1 210 140" fill="none" stroke="#8fbf9c" stroke-width="4" stroke-linecap="round"/>
    <path d="M210 300 A70 90 0 0 1 110 300" fill="none" stroke="#36454f" stroke-width="4" stroke-linecap="round"/>

    <!-- Bubble level -->
    <g transform="translate(95, 305)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#36454f" opacity="0.9"/>
      <rect x="5" y="11" width="120" height="6" rx="3" fill="#ffffff20"/>
      <circle cx="85" cy="14" r="8" fill="#ffb347"/>
      <text x="130" y="20" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2°</text>
    </g>

    <!-- Face outline -->
    <ellipse cx="160" cy="185" rx="38" ry="48" fill="none" stroke="#ffb347" stroke-width="2" opacity="0.8"/>

    <!-- Mirror bar with richer instruction -->
    <rect x="50" y="440" width="220" height="42" rx="21" fill="#36454f" opacity="0.9" stroke="#ffffff40" stroke-width="1"/>
    <text x="160" y="468" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Aim right · hold steady</text>

    <!-- Bottom controls -->
    <circle cx="160" cy="530" r="32" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="160" cy="530" r="24" fill="#fff"/>

    <text x="160" y="620" text-anchor="middle" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="16" font-weight="600">AFTER</text>
    <text x="160" y="642" text-anchor="middle" fill="#8a9aa3" font-family="system-ui, sans-serif" font-size="13">Direction arrow, progress, bubble level</text>
  </g>

  <!-- Improvement list -->
  <g transform="translate(900, 120)">
    <text x="0" y="0" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Recommended changes</text>

    <g transform="translate(0, 40)">
      <circle cx="8" cy="8" r="8" fill="#ffb347"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Add a direction arrow inside the frame</text>
    </g>

    <g transform="translate(0, 80)">
      <circle cx="8" cy="8" r="8" fill="#ffb347"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Show progress toward the target zone</text>
    </g>

    <g transform="translate(0, 120)">
      <circle cx="8" cy="8" r="8" fill="#ffb347"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Replace plain line with a bubble level</text>
    </g>

    <g transform="translate(0, 160)">
      <circle cx="8" cy="8" r="8" fill="#ffb347"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">4</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Highlight tracked faces with a soft outline</text>
    </g>

    <g transform="translate(0, 200)">
      <circle cx="8" cy="8" r="8" fill="#ffb347"/>
      <text x="8" y="13" text-anchor="middle" fill="#1a2024" font-family="system-ui, sans-serif" font-size="11" font-weight="700">5</text>
      <text x="28" y="13" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="15">Mirror bar: combine action + state</text>
    </g>

    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="230" height="90" rx="10" fill="#ffffff10" stroke="#ffffff20"/>
      <text x="14" y="28" fill="#ffb347" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Accessibility note</text>
      <text x="14" y="50" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="13">Never rely on color alone.</text>
      <text x="14" y="70" fill="#c7cdd1" font-family="system-ui, sans-serif" font-size="13">Use arrows, numbers, and haptics.</text>
    </g>
  </g>
</svg>